name: Prebuild
on: [push]
jobs:
  build-test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: python3 -m pip install setuptools --break-system-packages
      - run: npm install
      # npm install brings in the published platform binary; test the source being built instead
      - run: npm run recompile
      - run: npm test
      - run: npm run prebuild-libc-napi
      - run: npm run prebuild-libc-napi
        env:
          PREBUILD_ARCH: x64
      - run: tar --create --format ustar --verbose --file=prebuild-darwin.tar -C prebuilds .
        if: startsWith(github.ref, 'refs/tags/')
      - name: Prebuild
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: prebuild-darwin.tar
  build-test-win32:
    # windows-2025 ships Visual Studio 2026, which node-gyp 9 (bundled with Node 16 npm) cannot find
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: pip install setuptools
      - run: npm install
      - run: npm run recompile
      - run: npm test
      - run: npm run prebuild-win32
      - run: tar --create --verbose --file=prebuild-win32.tar -C prebuilds .
        #if: startsWith(github.ref, 'refs/tags/')
      - name: Prebuild
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: prebuild-win32.tar
  build-centos-7:
    #if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: yum update -y && yum install -y python3
      - run: curl https://raw.githubusercontent.com/kriszyp/musl-bins/main/aarch64-linux-musl-cross.tgz --output aarch64-linux-musl-cross.tgz
      - run: tar -xf aarch64-linux-musl-cross.tgz && pwd && ls
      - run: curl https://raw.githubusercontent.com/kriszyp/musl-bins/main/armv7l-linux-musleabihf-cross.tgz --output armv7l-linux-musleabihf-cross.tgz
      - run: tar -xf armv7l-linux-musleabihf-cross.tgz && pwd && ls
      - run: curl https://raw.githubusercontent.com/kriszyp/musl-bins/main/x86_64-linux-musl-native.tgz --output x86_64-linux-musl-native.tgz
      - run: tar -xf x86_64-linux-musl-native.tgz && pwd && ls
      - run: npm install
      - run: npm run prebuild-libc
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PREBUILD_LIBC: musl
          PREBUILD_ARCH: arm64
          CC: ${PWD}/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc
          CXX: ${PWD}/aarch64-linux-musl-cross/bin/aarch64-linux-musl-g++
      - run: npm run prebuild-libc
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PREBUILD_LIBC: musl
          PREBUILD_ARCH: arm
          PREBUILD_ARMV: 7
          CC: ${PWD}/armv7l-linux-musleabihf-cross/bin/armv7l-linux-musleabihf-gcc
          CXX: ${PWD}/armv7l-linux-musleabihf-cross/bin/armv7l-linux-musleabihf-g++
      - run: npm run prebuild-libc
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PREBUILD_LIBC: musl
          PREBUILD_ARCH: x64
          CC: ${PWD}/x86_64-linux-musl-native/bin/x86_64-linux-musl-gcc
          CXX: ${PWD}/x86_64-linux-musl-native/bin/x86_64-linux-musl-g++
      - run: npm run prebuild-libc
      - run: npm test
      - run: tar --create --verbose --file=prebuild-linux.tar -C prebuilds .
      - name: Prebuild
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: prebuild-linux.tar
  build-linux-arm64-glibc:
    runs-on: ubuntu-24.04-arm
    container: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: yum install -y python3
      - run: npm install
      - run: npm run prebuild-libc
      - run: npm test
      - run: tar --create --verbose --file=prebuild-linux-arm64-glibc.tar -C prebuilds .
      - name: Prebuild
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: prebuild-linux-arm64-glibc.tar
  build-linux-arm-glibc:
    # no hosted armv7 runner, so cross-compile
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - run: apt-get update && apt-get install -y python3 make g++ gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
        env:
          DEBIAN_FRONTEND: noninteractive
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: npm install
      - run: npm run prebuild-libc
        env:
          PREBUILD_ARCH: arm
          PREBUILD_ARMV: 7
          CC: arm-linux-gnueabihf-gcc
          CXX: arm-linux-gnueabihf-g++
      # this sysroot is glibc 2.31 and GCC 9; hold the glibc 2.28 / GCC 8 floor of the manylinux_2_28 builds
      - run: |
          for floor in GLIBC_2.28 GLIBCXX_3.4.25; do
            need=$( (echo $floor; arm-linux-gnueabihf-objdump -T prebuilds/linux-arm/*.node | grep -oE "${floor%_*}_[0-9.]+") | sort -uV | tail -1)
            [ "$need" = $floor ] || { echo "linux-arm prebuild needs $need, above $floor"; exit 1; }
          done
      - run: tar --create --verbose --file=prebuild-linux-arm-glibc.tar -C prebuilds .
      - name: Prebuild
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: prebuild-linux-arm-glibc.tar
